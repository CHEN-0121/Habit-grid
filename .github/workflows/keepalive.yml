name: 保持排程啟用

# 公開 repo 超過 60 天沒有活動，GitHub 會停用排程(推播提醒就會停)。
# 每月 1 號更新 .github/keepalive 並 commit 一次，讓 repo 一直算有活動。
on:
  schedule:
    - cron: "17 3 1 * *"   # 每月 1 號 UTC 03:17(台灣 11:17)
  workflow_dispatch:

permissions:
  contents: write

jobs:
  keepalive:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: 更新日期並 commit
        run: |
          date -u +%Y-%m-%d > .github/keepalive
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/keepalive
          git commit -m "chore: keepalive $(cat .github/keepalive)" || exit 0
          git push
